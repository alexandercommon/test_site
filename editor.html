<!DOCTYPE html>
<html>
<head>
  <title>CMS Editor</title>
  <script src="https://cdn.jsdelivr.net/npm/@json-editor/json-editor@2.15.1/dist/jsoneditor.min.js"></script>
</head>
<body>
  <div id="editor"></div>
  <button id="save">Save Changes</button>
  <script>
    let editor;
    let fileSha;
    const schema = { type: "object", properties: { site_name: { type: "string" }, maintenance_mode: { type: "boolean" } } };
    async function loadData() {
      const res = await fetch('/api/cms');
      if (res.status === 401) { window.location.href = 'https://github.com/login/oauth/authorize?client_id=YOUR_CLIENT_ID'; return; }
      const data = await res.json();
      fileSha = data.sha;
      const jsonContent = JSON.parse(atob(data.content));
      editor = new JSONEditor(document.getElementById('editor'), { schema: schema, startval: jsonContent });
    }
    document.getElementById('save').addEventListener('click', async () => {
      const updatedData = editor.getValue();
      updatedData.sha = fileSha;
      const res = await fetch('/api/cms', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(updatedData) });
      if (res.ok) alert('Saved successfully!');
    });
    loadData();
  </script>
</body>
</html>
